<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#D1D5DB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#DC2626" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Aerodynamic vehicle roofline silhouette swoosh -->
  <path d="M 35,46 C 75,20 125,12 210,12 C 290,12 360,22 410,48" 
        stroke="url(#redGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  
  <path d="M 60,40 C 105,18 160,16 220,16 C 285,16 345,24 395,44" 
        stroke="url(#silverGrad)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Left car headlight / fender accent -->
  <path d="M 22,50 C 30,48 40,48 48,50" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  
  <!-- Right car rear spoiler accent -->
  <path d="M 405,52 C 418,50 432,50 440,53" stroke="url(#silverGrad)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Main Wordmark: CHRIS (Bold Red) -->
  <text x="35" y="74" 
        font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="1.5" 
        fill="#DC2626">CHRIS</text>

  <!-- Main Wordmark: AUTO (Metallic Silver / Chrome) -->
  <text x="215" y="74" 
        font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="44" 
        letter-spacing="2" 
        fill="url(#silverGrad)">AUTO</text>

  <!-- Red divider slash accent -->
  <line x1="202" y1="48" x2="208" y2="76" stroke="#DC2626" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Subtitle Bar: CAR RENTALS with decorative bounding lines -->
  <line x1="38" y1="94" x2="135" y2="94" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" />
  
  <text x="230" y="99" 
        font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" 
        font-weight="700" 
        font-size="14.5" 
        letter-spacing="6" 
        text-anchor="middle"
        fill="#F3F4F6">CAR RENTALS</text>
        
  <line x1="325" y1="94" x2="422" y2="94" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Subtle center accent dot -->
  <circle cx="150" cy="94" r="2" fill="#DC2626" />
  <circle cx="310" cy="94" r="2" fill="#DC2626" />
</svg>
